global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'va-api-gateway'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'backend-services'
    static_configs:
      - targets: 
        - 'agent-api:8001'
        - 'model-api:8002'
        - 'crud-api:8003'
    metrics_path: '/metrics'

# Alerting rules
rule_files:
  - 'alerts.yml'

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
