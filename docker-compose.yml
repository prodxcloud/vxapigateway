version: '3.8'

services:
  # API Gateway
  gateway:
    build: .
    container_name: va_api_gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - MAX_RPS=100
      - DDOS_THRESHOLD=1000
      - REDIS_ADDR=redis:6379
      - LOAD_BALANCING_ALGO=least-conn
    depends_on:
      - redis
      - jaeger
      - prometheus
    networks:
      - gateway_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: va_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: va_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gateway_network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: va_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - gateway_network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: va_jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - gateway_network
    restart: unless-stopped

  # Backend Services (Mock for testing)
  agent-api:
    image: python:3.11-slim
    container_name: va_agent_api
    ports:
      - "8001:8001"
    command: python -m http.server 8001
    networks:
      - gateway_network
    restart: unless-stopped

  model-api:
    image: python:3.11-slim
    container_name: va_model_api
    ports:
      - "8002:8002"
    command: python -m http.server 8002
    networks:
      - gateway_network
    restart: unless-stopped

  crud-api:
    image: python:3.11-slim
    container_name: va_crud_api
    ports:
      - "8003:8003"
    command: python -m http.server 8003
    networks:
      - gateway_network
    restart: unless-stopped

networks:
  gateway_network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
