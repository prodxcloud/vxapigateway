<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA API Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .status {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 2rem;
            margin-top: 2rem;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .badge {
            background: #10b981;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        a {
            color: #fff;
            text-decoration: none;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            transition: border-color 0.3s;
        }
        a:hover {
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 VA API Gateway</h1>
        <p>High-performance API Gateway with nginx reverse proxy</p>
        
        <div class="status">
            <div class="status-item">
                <span>Status</span>
                <span class="badge">Online</span>
            </div>
            <div class="status-item">
                <span>Reverse Proxy</span>
                <span>nginx</span>
            </div>
            <div class="status-item">
                <span>Backend</span>
                <span>Go/Gin</span>
            </div>
            <div class="status-item">
                <span>Health Check</span>
                <span><a href="/health">/health</a></span>
            </div>
            <div class="status-item">
                <span>Metrics</span>
                <span><a href="/metrics">/metrics</a></span>
            </div>
        </div>
    </div>
</body>
</html>
